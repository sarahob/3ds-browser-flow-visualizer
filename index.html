<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>3DS Browser Flow Visualizer</title>
    <script>
      // Set the theme before first paint: the saved choice, else the OS setting.
      ;(function () {
        var t
        try { t = localStorage.getItem('3ds-viz-theme') } catch (e) {}
        if (t ? t === 'dark' : window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches)
          document.documentElement.classList.add('dark')
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
